name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests || true
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            PYTHONPATH=. pytest tests/ -v --tb=short
          else
            echo "No tests/ directory — skip"
          fi
        env:
          APP_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long!!
          DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav_tube
          DATABASE_URL_SYNC: postgresql+psycopg://vrav:vrav@localhost:5432/vrav_tube

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache only when lockfile exists — see install step
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck & build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vrav
          POSTGRES_PASSWORD: vrav
          POSTGRES_DB: vrav_tube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vrav -d vrav_tube"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long!!
      DATABASE_URL: postgresql+asyncpg://vrav:vrav@localhost:5432/vrav_tube
      DATABASE_URL_SYNC: postgresql+psycopg://vrav:vrav@localhost:5432/vrav_tube
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ORIGINS: '["http://localhost:5173"]'
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import psycopg; print('psycopg', psycopg.__version__)"
      - name: Migrate
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Health check
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "health endpoint not ready (non-fatal for scaffold)"
          exit 0
